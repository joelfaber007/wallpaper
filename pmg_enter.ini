author = Joel Faber
description = Fold the point into one copy of the fundamental domain of wallpaper group pmg (orbifold 22*), exactly as the pmg fold does, and keep which copy, in which cell, it was taken from, so that the pmg exit can carry it back there.
 Functions placed between the enter and the exit act on the point inside the one copy, and the exit carries what they do back to the tile the point came from, turned and flipped with it. So each tile has those functions applied in its own frame, and every point ends in the tile it started in: unlike the fold and the scatter, the pair spreads nothing over the tiling, and the pattern covers what came in.
 `tile_id` names the buffer the tile is kept in. Give the exit the same one, and give a pair nested inside another pair a different one.
 Give the exit the lattice parameters of the enter, or the point will be carried back to a tile of a different lattice.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_pmg_enter
info = f"{lattice_helpers.rectangular_kind(Params.a, Params.b)} lattice, tiles {Params.tile_id}"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.4, min=0.01, max=100.0)
tile_id = pyro_param_integer(0, min=0)

[wallpaper_pmg_enter]
zin = Buffer(Global.PyroXY)

# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

# Where the copies lie: the lattice basis the copy table's (u, v) are
# written in, then a reduced basis of the same lattice and the rows of its
# inverse, which the kernel finds the nearest repeat of each copy with.
cell0 = pyro_complex(wallpaper_helpers.basis("pmg", Params.a, Params.b, 0))
cell1 = pyro_complex(wallpaper_helpers.basis("pmg", Params.a, Params.b, 1))
near0 = pyro_complex(fold_helpers.near_basis("pmg", Params.a, Params.b, 0))
near1 = pyro_complex(fold_helpers.near_basis("pmg", Params.a, Params.b, 1))
inv0 = pyro_complex(fold_helpers.near_fold("pmg", Params.a, Params.b, 0))
inv1 = pyro_complex(fold_helpers.near_fold("pmg", Params.a, Params.b, 1))

# The rows of the inverse of the basis the copy table is written in, which
# turn the cell the point was taken from into whole steps of that basis.
cinv0 = pyro_complex(wallpaper_helpers.fold("pmg", Params.a, Params.b, 0))
cinv1 = pyro_complex(wallpaper_helpers.fold("pmg", Params.a, Params.b, 1))

# One preset for each lattice type a rectangular cell can make. They set only
# the lattice, so the rest of the parameters are left as they are.
[PYRO_PRESET.Rectangular]
a = 1.0
b = 1.4

[PYRO_PRESET.Square]
a = 1.0
b = 1.0
