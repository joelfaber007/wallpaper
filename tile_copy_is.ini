author = Joel Faber
description = Decide whether the tile a wallpaper enter function took the point from is one particular tile, so a single tile can be picked out.
 A tile is named by its copy of the fundamental domain -- its row in the group's copy table, as `<group>_tile_copy` lists them among its outputs -- and its cell, as whole steps (m, n) of the lattice basis. Copy 0 in cell (0, 0) is the domain itself.
 It reads the tile the enter kept, so place it anywhere after the enter. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_tile_copy_is
info = f"copy {Params.copy} in cell ({Params.m}, {Params.n}), tiles {Params.tile_id}"

[PYRO_PARAMETERS]
copy = pyro_param_integer(0, min=0, max=11)
m = pyro_param_integer(0, min=-1000, max=1000)
n = pyro_param_integer(0, min=-1000, max=1000)
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
match = The tile is copy `copy` in cell (`m`, `n`).
other = The tile is any other.

[wallpaper_tile_copy_is]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

copy = pyro_int(Params.copy)
m = pyro_int(Params.m)
n = pyro_int(Params.n)

active_output_ids = Buffer(Global.ActiveOutputIDs)
