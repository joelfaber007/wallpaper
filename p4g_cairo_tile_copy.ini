author = Joel Faber
description = Decide which of the four turns of a Cairo pentagon, with the symmetry of wallpaper group p4g (orbifold 4*2), the tile the p4g Cairo enter took the point from is, so each orientation of the tile can be treated differently.
 Each output is one of the four pentagons in a cell, named by the quarter turn about the origin that carries the first pentagon onto it. Every cell holds one of each, so the outputs colour the tiling by orientation, the same in every cell. The four pentagons around each 4-fold centre are one of each, so the four outputs colour the Cairo tiling with no two pentagons that share an edge alike.
 It reads the tile the enter kept, so place it anywhere after the enter: between the enter and the exit, or after the exit once the point is back in its tile. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_p4g_cairo_tile_copy
info = f"tiles {Params.tile_id}"

[PYRO_PARAMETERS]
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
turn_0 = The tile is the first pentagon, the one the fold carries every point into.
turn_90 = The tile is the first pentagon turned through 90 degrees about the origin.
turn_180 = The tile is the first pentagon turned through 180 degrees about the origin.
turn_270 = The tile is the first pentagon turned through 270 degrees about the origin.

[wallpaper_p4g_cairo_tile_copy]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

active_output_ids = Buffer(Global.ActiveOutputIDs)
