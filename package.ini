# The Python this package supplies to its own INI expressions, in python/.
# Declaring the list is optional -- a package that leaves it out gets every
# module in that directory -- but naming them here means the whole of what
# Python this package runs can be read from one file.
python_modules = ["lattice_helpers", "_wallpaper_moves", "wallpaper_helpers", "fold_helpers"]

# The tile an enter function took each point from, which the matching exit
# function reads to carry the point back: the copy of the fundamental domain,
# as its row in the group's copy table; 1 when that copy is the domain only
# turned, and -1 when it is the domain flipped over; and the cell, as whole
# steps (m, n) of the lattice basis.
package_structures = ["WallpaperTile"]

[WallpaperTile]
copy = pyro_int(0)
flip = pyro_int(1)
m = pyro_int(0)
n = pyro_int(0)
