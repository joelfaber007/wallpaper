author = The PyroFractal Team
description = Decide which of wallpaper group pmm's special positions (orbifold *2222) holds the input point, so a tile can be treated one way where the group pins it down and another where it does not.
 pmm has four classes of rotation centre (four 2-fold) and two directions of mirror line. A class of rotation centre is a set the group carries one into another - a motif placed on one appears on all of them - so telling the classes apart is telling apart the features that can be decorated independently. Each gets an output of its own.
 `radius` is how near a rotation centre counts as being on it, and `width` how near a line counts. Both are in the same units as the lattice.
 A rotation centre is tested before the lines through it: most centres lie on a mirror, and of the two the centre is the more particular place.
 The positions come from the same move table the pmm transform steps by, so give this the lattice parameters that transform has or the positions will not be where the tiling put them.
type = FUNCTION
class = DECISION
kernel = wallpaper_pmm_region

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.4, min=0.01, max=100.0)
radius = pyro_param_real(0.149, min=0.0, max=100.0)
width = pyro_param_real(0.036, min=0.0, max=100.0)

[PYRO_OUTPUTS]
centre_0 = The point is within the radius of a 2-fold rotation centre of the first class, of which every cell holds one.
centre_1 = The point is within the radius of a 2-fold rotation centre of the second class, of which every cell holds one.
centre_2 = The point is within the radius of a 2-fold rotation centre of the third class, of which every cell holds one.
centre_3 = The point is within the radius of a 2-fold rotation centre of the fourth class, of which every cell holds one.
mirror = The point is within the width of a mirror line, which the group turns the plane over about while holding every point of the line still.
general = The point is on none of the group's special positions, and is held by nothing but the translations.

[wallpaper_pmm_region]
zin = Buffer(Global.PyroXY)

# Folding the point into one cell is the first thing any question about
# where it lies has to do, and takes the basis both ways round.
fold0 = pyro_complex(wallpaper_helpers.fold("pmm", Params.a, Params.b, 0))
fold1 = pyro_complex(wallpaper_helpers.fold("pmm", Params.a, Params.b, 1))
cell0 = pyro_complex(wallpaper_helpers.basis("pmm", Params.a, Params.b, 0))
cell1 = pyro_complex(wallpaper_helpers.basis("pmm", Params.a, Params.b, 1))

# Squared here so the kernel compares squared distances and no point pays
# for a square root.
r_squared = pyro_real(Params.radius * Params.radius)

# The first class: 2-fold, one to a cell.
centre_0_0 = pyro_complex(wallpaper_helpers.centre("pmm", 2, 0, 0, Params.a, Params.b))

# The second class: 2-fold, one to a cell.
centre_1_0 = pyro_complex(wallpaper_helpers.centre("pmm", 2, 1, 0, Params.a, Params.b))

# The third class: 2-fold, one to a cell.
centre_2_0 = pyro_complex(wallpaper_helpers.centre("pmm", 2, 2, 0, Params.a, Params.b))

# The fourth class: 2-fold, one to a cell.
centre_3_0 = pyro_complex(wallpaper_helpers.centre("pmm", 2, 3, 0, Params.a, Params.b))

width = pyro_real(Params.width)

# The first direction of mirror line: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
mirror_0 = pyro_complex(wallpaper_helpers.mirror_direction("pmm", 0, Params.a, Params.b))
mirror_0_at = pyro_real(wallpaper_helpers.mirror_offset("pmm", 0, Params.a, Params.b))
mirror_0_gap = pyro_real(wallpaper_helpers.mirror_spacing("pmm", 0, Params.a, Params.b))

# The second direction of mirror line: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
mirror_1 = pyro_complex(wallpaper_helpers.mirror_direction("pmm", 1, Params.a, Params.b))
mirror_1_at = pyro_real(wallpaper_helpers.mirror_offset("pmm", 1, Params.a, Params.b))
mirror_1_gap = pyro_real(wallpaper_helpers.mirror_spacing("pmm", 1, Params.a, Params.b))

active_output_ids = Buffer(Global.ActiveOutputIDs)
