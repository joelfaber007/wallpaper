author = Joel Faber
description = Decide which of wallpaper group pm's special positions (orbifold **) holds the input point, so a tile can be treated one way where the group pins it down and another where it does not.
 pm has one direction of mirror line. A class of rotation centre is a set the group carries one into another - a motif placed on one appears on all of them - so telling the classes apart is telling apart the features that can be decorated independently. Each gets an output of its own.
 `width` is how near a line counts as being on it, in the same units as the lattice.
 The positions come from the same move table the pm transform steps by, so give this the lattice parameters that transform has or the positions will not be where the tiling put them.
type = FUNCTION
class = DECISION
kernel = wallpaper_pm_region
info = f"{lattice_helpers.rectangular_kind(Params.a, Params.b)} lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.4, min=0.01, max=100.0)
width = pyro_param_real(0.062, min=0.0, max=100.0)

[PYRO_OUTPUTS]
mirror = The point is within the width of a mirror line, which the group turns the plane over about while holding every point of the line still.
general = The point is on none of the group's special positions, and is held by nothing but the translations.

[wallpaper_pm_region]
zin = Buffer(Global.PyroXY)

width = pyro_real(Params.width)

# The first direction of mirror line: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
mirror_0 = pyro_complex(wallpaper_helpers.mirror_direction("pm", 0, Params.a, Params.b))
mirror_0_at = pyro_real(wallpaper_helpers.mirror_offset("pm", 0, Params.a, Params.b))
mirror_0_gap = pyro_real(wallpaper_helpers.mirror_spacing("pm", 0, Params.a, Params.b))

active_output_ids = Buffer(Global.ActiveOutputIDs)

# One preset for each lattice type a rectangular cell can make. They set only
# the lattice, so the rest of the parameters are left as they are.
[PYRO_PRESET.Rectangular]
a = 1.0
b = 1.4

[PYRO_PRESET.Square]
a = 1.0
b = 1.0
