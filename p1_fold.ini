author = Joel Faber
description = Fold the point into one copy of the fundamental domain of wallpaper group p1 (orbifold o), carrying it back by whichever of the group's isometries carried it out.
 A fundamental domain is the smallest piece of the plane the group repeats. One cell of the lattice holds one copy of it, which is a whole cell, and the fold sends every point of the plane to the place in the first copy that it is a repeat of. Unlike the p1 transform it is not random: the same point always folds to the same place.
 Placed before the p1 transform, the fold makes a kaleidoscope: whatever lands anywhere in the plane is gathered into one copy, and the transform repeats that copy over the whole tiling.
 The domain is everything nearer a seed point of the cell than any other image of the seed under the group.
 `a` is the length of the first lattice vector, which lies along the x axis, and `b` and `gamma` are the length of the second and the angle it makes with the first. Give it the lattice parameters of the p1 transform it works with, or the domain will not line up with the tiling.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p1_fold
info = f"{lattice_helpers.oblique_kind(Params.a, Params.b, Params.gamma)} lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.0, min=0.01, max=100.0)
gamma = pyro_param_real(2 * numpy.pi / 5, min=0.01, max=numpy.pi - 0.01)

[wallpaper_p1_fold]
zin = Buffer(Global.PyroXY)

# Where the copies lie: the lattice basis the copy table's (u, v) are
# written in, then a reduced basis of the same lattice and the rows of its
# inverse, which the kernel finds the nearest repeat of each copy with.
cell0 = pyro_complex(wallpaper_helpers.oblique_basis("p1", Params.a, Params.b, Params.gamma, 0))
cell1 = pyro_complex(wallpaper_helpers.oblique_basis("p1", Params.a, Params.b, Params.gamma, 1))
near0 = pyro_complex(fold_helpers.oblique_near_basis("p1", Params.a, Params.b, Params.gamma, 0))
near1 = pyro_complex(fold_helpers.oblique_near_basis("p1", Params.a, Params.b, Params.gamma, 1))
inv0 = pyro_complex(fold_helpers.oblique_near_fold("p1", Params.a, Params.b, Params.gamma, 0))
inv1 = pyro_complex(fold_helpers.oblique_near_fold("p1", Params.a, Params.b, Params.gamma, 1))

# One preset for each of the five lattice types. They set only the lattice,
# so the rest of the parameters are left as they are.
[PYRO_PRESET.Oblique]
a = 1.0
b = 1.4
gamma = 2 * pi / 5

[PYRO_PRESET.Rectangular]
a = 1.0
b = 1.4
gamma = pi / 2

[PYRO_PRESET.Rhombic]
a = 1.0
b = 1.0
gamma = 2 * pi / 5

[PYRO_PRESET.Square]
a = 1.0
b = 1.0
gamma = pi / 2

[PYRO_PRESET.Hexagonal]
a = 1.0
b = 1.0
gamma = pi / 3
