author = Joel Faber
description = Set the integer variable to the copy of the fundamental domain a wallpaper enter function took the point from, as its row in the group's copy table -- the order `<group>_tile_copy` lists them among its outputs. Copy 0 is the domain itself.
 It reads the tile the enter kept, so place it anywhere after the enter. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote. `var_int_id` names the integer variable it sets.
type = FUNCTION
class = VARIABLE
kernel = wallpaper_tile_copy_to_int
icon = Icons.nf.md.variable
info = f"tiles {Params.tile_id} into integer {Params.var_int_id}"

[PYRO_PARAMETERS]
tile_id = pyro_param_integer(0, min=0)
var_int_id = pyro_param_integer(0)

[wallpaper_tile_copy_to_int]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

var_int = Buffer(Global.PyroInt, category="INTEGER", id=Params.var_int_id)
