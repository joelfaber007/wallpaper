author = Joel Faber
description = Decide which class of cell the tile a wallpaper enter function took the point from lies in, so the cells of a tiling can be painted in stripes, checks or bands.
 The cell is the one the enter kept, as whole steps (m, n) of the lattice basis, and its class is p*m + q*n modulo k. With p = q = 1 and k = 2 the cells of a square or rectangular lattice make a checkerboard; with q = 0 they make stripes along the second basis vector, and with p = 0 along the first; a larger k repeats every k cells instead of every two. On a hexagonal lattice p = 1, q = -1 and k = 3 gives every cell a class unlike any of its six neighbours'.
 Every copy of the domain in a cell is in the cell's class. Branch on `tile_side` or `<group>_tile_copy` as well to tell the copies apart.
 It reads the tile the enter kept, so place it anywhere after the enter. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_tile_cell_class
info = f"p {Params.p}, q {Params.q}, mod {Params.k}, tiles {Params.tile_id}"

[PYRO_PARAMETERS]
p = pyro_param_integer(1, min=-12, max=12)
q = pyro_param_integer(1, min=-12, max=12)
k = pyro_param_integer(2, min=2, max=4)
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
class_0 = p*m + q*n leaves 0 when divided by k.
class_1 = p*m + q*n leaves 1 when divided by k.
class_2 = p*m + q*n leaves 2 when divided by k. Taken only when k is 3 or more.
class_3 = p*m + q*n leaves 3 when divided by k. Taken only when k is 4.

[wallpaper_tile_cell_class]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

p = pyro_int(Params.p)
q = pyro_int(Params.q)
k = pyro_int(Params.k)

active_output_ids = Buffer(Global.ActiveOutputIDs)
