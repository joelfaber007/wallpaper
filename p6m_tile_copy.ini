author = Joel Faber
description = Decide which copy of the fundamental domain of wallpaper group p6m (orbifold *632) the tile the p6m enter took the point from is, so each orientation of the tile can be treated differently.
 Each output is one copy of the domain in a cell, named by the turn or the flip that carries the domain onto it: turn_90 is the domain turned through 90 degrees, and flip_45 the domain flipped over a line at 45 degrees. Every cell holds one of each, so the outputs colour the tiling by orientation, the same in every cell.
 It reads the tile the enter kept, so place it anywhere after the enter: between the enter and the exit, or after the exit once the point is back in its tile. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_p6m_tile_copy
info = f"tiles {Params.tile_id}"

[PYRO_PARAMETERS]
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
turn_0 = The tile is the fundamental domain itself, in the copy table's first row.
turn_60 = The tile is the fundamental domain turned through 60 degrees.
turn_120 = The tile is the fundamental domain turned through 120 degrees.
turn_180 = The tile is the fundamental domain turned through 180 degrees.
turn_240 = The tile is the fundamental domain turned through 240 degrees.
turn_300 = The tile is the fundamental domain turned through 300 degrees.
flip_0 = The tile is the fundamental domain flipped over a line at 0 degrees, by a mirror or a glide along it.
flip_30 = The tile is the fundamental domain flipped over a line at 30 degrees, by a mirror or a glide along it.
flip_60 = The tile is the fundamental domain flipped over a line at 60 degrees, by a mirror or a glide along it.
flip_90 = The tile is the fundamental domain flipped over a line at 90 degrees, by a mirror or a glide along it.
flip_120 = The tile is the fundamental domain flipped over a line at 120 degrees, by a mirror or a glide along it.
flip_150 = The tile is the fundamental domain flipped over a line at 150 degrees, by a mirror or a glide along it.

[wallpaper_p6m_tile_copy]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

active_output_ids = Buffer(Global.ActiveOutputIDs)
