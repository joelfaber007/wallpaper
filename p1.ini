author = The PyroFractal Team
description = Step the point into an adjacent tile of wallpaper group p1 (orbifold o), so iterating repeats the pattern across the plane by translation alone.
 p1 has no symmetry beyond its lattice, so the only steps are the six translations to the neighbouring tiles.
 The lattice is oblique: `a` is the length of the first lattice vector, which lies along the x axis, and `b` and `gamma` are the length of the second and the angle it makes with the first.
 The lattice, not the basis, is what gets tiled: the pair you type is reduced to the shortest pair generating the same lattice, and the walk steps along that pair and the shorter diagonal of the cell they span.
 One call applies one of the six translations, picked at random, so the point lands in a neighbouring tile.
 The moves are not equally likely: their shares are set so the pattern spreads at the same rate in every direction on any lattice, which keeps the tessellation from stretching into a band. A hexagonal lattice draws all six equally, and a rectangular one never steps along the diagonal.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p1

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.0, min=0.01, max=100.0)
gamma = pyro_param_real(2 * numpy.pi / 5, min=0.01, max=numpy.pi - 0.01)

[wallpaper_p1]
zin = Buffer(Global.PyroXY)
random_state = Buffer(Global.PyroRNG)

# The walk steps by the basis vectors and their sum, so a long thin basis
# spreads the render into a band. Reduction picks the shortest pair that
# generates the same lattice, at 90 degrees or more to each other so their
# sum is the shorter diagonal, which leaves the tiling alone and evens the
# spread out.
a1 = pyro_complex(lattice_helpers.reduced(Params.a, Params.b, Params.gamma, 0))
a2 = pyro_complex(lattice_helpers.reduced(Params.a, Params.b, Params.gamma, 1))

# The moves are drawn with unequal probability so the walk spreads at the
# same rate in every direction. The shares are worked out on the host from
# the move table itself and handed over already accumulated, so the kernel
# picks a move with one uniform draw and no branch.
cw0 = pyro_real(wallpaper_helpers.oblique_threshold("p1", 0, Params.a, Params.b, Params.gamma))
cw1 = pyro_real(wallpaper_helpers.oblique_threshold("p1", 1, Params.a, Params.b, Params.gamma))
cw2 = pyro_real(wallpaper_helpers.oblique_threshold("p1", 2, Params.a, Params.b, Params.gamma))
cw3 = pyro_real(wallpaper_helpers.oblique_threshold("p1", 3, Params.a, Params.b, Params.gamma))
cw4 = pyro_real(wallpaper_helpers.oblique_threshold("p1", 4, Params.a, Params.b, Params.gamma))
