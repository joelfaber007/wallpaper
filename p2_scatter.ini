author = Joel Faber
description = Carry the point to a random copy of the fundamental domain of wallpaper group p2 (orbifold 2222) within `reach` of the origin, so a pattern folded into the domain is spread evenly over the tiling in one step.
 Each call picks one of the two copies of the domain in a cell, each as likely as the others, and applies the isometry of the group that carries the first copy onto it; then it moves the point by a lattice translation to a cell picked evenly from those within `reach` of the origin. Cells the edge of `reach` cuts through are picked in proportion to how much of them lies inside it.
 Unlike the p2 transform, which walks from tile to tile, nothing here depends on how many times it has run: after one call every copy in reach is as likely as every other, so the tiling is even across the whole of `reach` and stops at its edge. Set `reach` to cover the view; 0 keeps the point in the cell at the origin.
 Place it after the p2 fold, which gathers everything into the first copy; a point that is not in the first copy is still carried by a random isometry of the group, but the cells it lands in are counted from wherever it was.
 `a` is the length of the first lattice vector, which lies along the x axis, and `b` and `gamma` are the length of the second and the angle it makes with the first. Give it the lattice parameters of the fold it follows.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p2_scatter
info = f"{lattice_helpers.oblique_kind(Params.a, Params.b, Params.gamma)} lattice, reach {Params.reach:g}"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.0, min=0.01, max=100.0)
gamma = pyro_param_real(2 * numpy.pi / 5, min=0.01, max=numpy.pi - 0.01)
reach = pyro_param_real(5.0, min=0.0, max=1000.0)

[wallpaper_p2_scatter]
zin = Buffer(Global.PyroXY)
random_state = Buffer(Global.PyroRNG)

# Where the copies lie: the lattice basis the copy table's (u, v) are
# written in, then a reduced basis of the same lattice and the rows of its
# inverse, which the kernel finds the nearest repeat of each copy with.
cell0 = pyro_complex(wallpaper_helpers.oblique_basis("p2", Params.a, Params.b, Params.gamma, 0))
cell1 = pyro_complex(wallpaper_helpers.oblique_basis("p2", Params.a, Params.b, Params.gamma, 1))
near0 = pyro_complex(fold_helpers.oblique_near_basis("p2", Params.a, Params.b, Params.gamma, 0))
near1 = pyro_complex(fold_helpers.oblique_near_basis("p2", Params.a, Params.b, Params.gamma, 1))
inv0 = pyro_complex(fold_helpers.oblique_near_fold("p2", Params.a, Params.b, Params.gamma, 0))
inv1 = pyro_complex(fold_helpers.oblique_near_fold("p2", Params.a, Params.b, Params.gamma, 1))

# The radius of the disc about the origin the cells are picked from.
reach = pyro_real(Params.reach)

# One preset for each of the five lattice types. They set only the lattice,
# so the rest of the parameters are left as they are.
[PYRO_PRESET.Oblique]
a = 1.0
b = 1.4
gamma = 2 * pi / 5

[PYRO_PRESET.Rectangular]
a = 1.0
b = 1.4
gamma = pi / 2

[PYRO_PRESET.Rhombic]
a = 1.0
b = 1.0
gamma = 2 * pi / 5

[PYRO_PRESET.Square]
a = 1.0
b = 1.0
gamma = pi / 2

[PYRO_PRESET.Hexagonal]
a = 1.0
b = 1.0
gamma = pi / 3
