author = Joel Faber
description = Step the point into an adjacent tile of wallpaper group cm (orbifold *x), so iterating tiles the plane with that group's symmetry.
 cm is a centred rectangular lattice together with a family of mirrors, and the glide reflections that the centring forces between them.
 `a` and `b` are the sides of the rectangular cell: `a` along the x axis, `b` along the y axis. Centring adds a lattice point at the middle of every cell. The mirrors are parallel to the y axis.
 One call applies one of the four cell translations, one of the two centring translations, the mirror or the glide in one of its two directions, picked at random, so the point lands in a neighbouring tile.
 `symmetry` is the share of steps that turn the plane over onto itself - the rotations, mirrors and glides - rather than carrying the point to another tile. Raise it to resolve each tile's own symmetry more finely, lower it to spread the pattern across the pane faster.
 The moves are not equally likely: their shares are set so the pattern spreads at the same rate in every direction, which keeps the tessellation even across the render instead of stretching it into a band.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_cm
info = f"{lattice_helpers.centred_kind(Params.a, Params.b)} lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.4, min=0.01, max=100.0)
symmetry = pyro_param_real(0.5, min=0.01, max=0.99)

[wallpaper_cm]
zin = Buffer(Global.PyroXY)
random_state = Buffer(Global.PyroRNG)

a = pyro_real(Params.a)
b = pyro_real(Params.b)

# The moves are drawn with unequal probability so the walk spreads equally in
# every direction whatever shape the cell is. The shares are worked out on the
# host from the move table itself and handed over already accumulated, so the
# kernel picks a move with one uniform draw and no branch.
cw0 = pyro_real(wallpaper_helpers.threshold("cm", 0, Params.a, Params.b, Params.symmetry))
cw1 = pyro_real(wallpaper_helpers.threshold("cm", 1, Params.a, Params.b, Params.symmetry))
cw2 = pyro_real(wallpaper_helpers.threshold("cm", 2, Params.a, Params.b, Params.symmetry))
cw3 = pyro_real(wallpaper_helpers.threshold("cm", 3, Params.a, Params.b, Params.symmetry))
cw4 = pyro_real(wallpaper_helpers.threshold("cm", 4, Params.a, Params.b, Params.symmetry))
cw5 = pyro_real(wallpaper_helpers.threshold("cm", 5, Params.a, Params.b, Params.symmetry))
cw6 = pyro_real(wallpaper_helpers.threshold("cm", 6, Params.a, Params.b, Params.symmetry))
cw7 = pyro_real(wallpaper_helpers.threshold("cm", 7, Params.a, Params.b, Params.symmetry))

# One preset for each lattice type a centred rectangular cell can make: equal
# sides give a square lattice turned 45 degrees to the cell, and sides in the
# ratio sqrt(3) a hexagonal one. They set only the lattice, so the rest of the
# parameters are left as they are.
[PYRO_PRESET.Rhombic]
a = 1.0
b = 1.4

[PYRO_PRESET.Square]
a = 1.0
b = 1.0

[PYRO_PRESET.Hexagonal]
a = 1.0
b = numpy.sqrt(3)
