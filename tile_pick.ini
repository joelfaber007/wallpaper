author = Joel Faber
description = Decide whether the tile a wallpaper enter function took the point from is among a share of the tiles picked at random, so a random scattering of tiles can be treated differently from the rest.
 The pick is made from the tile itself -- which copy of the domain, in which cell -- so every point of a tile goes the same way, and the same tiles are picked on every iteration. Tiles next to one another are picked independently.
 `share` is the fraction of the tiles picked: 0 picks none and 1 picks all. `salt` reshuffles which tiles they are without changing how many.
 It reads the tile the enter kept, so place it anywhere after the enter. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_tile_pick
info = f"share {Params.share:g}, salt {Params.salt}, tiles {Params.tile_id}"

[PYRO_PARAMETERS]
share = pyro_param_real(0.5, min=0.0, max=1.0)
salt = pyro_param_integer(0, min=0, max=1000000)
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
picked = The tile is one of those picked.
rest = The tile is not one of those picked.

[wallpaper_tile_pick]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

share = pyro_real(Params.share)
salt = pyro_int(Params.salt)

active_output_ids = Buffer(Global.ActiveOutputIDs)
