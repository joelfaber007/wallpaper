author = The PyroFractal Team
description = Decide which of wallpaper group p2's special positions (orbifold 2222) holds the input point, so a tile can be treated one way where the group pins it down and another where it does not.
 p2 has four classes of rotation centre (four 2-fold). A class of rotation centre is a set the group carries one into another - a motif placed on one appears on all of them - so telling the classes apart is telling apart the features that can be decorated independently. Each gets an output of its own.
 `radius` is how near a rotation centre counts as being on it. It is in the same units as the lattice.
 The positions come from the same move table the p2 transform steps by, so give this the lattice parameters that transform has or the positions will not be where the tiling put them.
type = FUNCTION
class = DECISION
kernel = wallpaper_p2_region

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.0, min=0.01, max=100.0)
gamma = pyro_param_real(2 * numpy.pi / 5, min=0.01, max=numpy.pi - 0.01)
radius = pyro_param_real(0.123, min=0.0, max=100.0)

[PYRO_OUTPUTS]
centre_0 = The point is within the radius of a 2-fold rotation centre of the first class, of which every cell holds one.
centre_1 = The point is within the radius of a 2-fold rotation centre of the second class, of which every cell holds one.
centre_2 = The point is within the radius of a 2-fold rotation centre of the third class, of which every cell holds one.
centre_3 = The point is within the radius of a 2-fold rotation centre of the fourth class, of which every cell holds one.
general = The point is on none of the group's special positions, and is held by nothing but the translations.

[wallpaper_p2_region]
zin = Buffer(Global.PyroXY)

# Folding the point into one cell is the first thing any question about
# where it lies has to do, and takes the basis both ways round.
fold0 = pyro_complex(wallpaper_helpers.oblique_fold("p2", Params.a, Params.b, Params.gamma, 0))
fold1 = pyro_complex(wallpaper_helpers.oblique_fold("p2", Params.a, Params.b, Params.gamma, 1))
cell0 = pyro_complex(wallpaper_helpers.oblique_basis("p2", Params.a, Params.b, Params.gamma, 0))
cell1 = pyro_complex(wallpaper_helpers.oblique_basis("p2", Params.a, Params.b, Params.gamma, 1))

# Squared here so the kernel compares squared distances and no point pays
# for a square root.
r_squared = pyro_real(Params.radius * Params.radius)

# The first class: 2-fold, one to a cell.
centre_0_0 = pyro_complex(wallpaper_helpers.oblique_centre("p2", 2, 0, 0, Params.a, Params.b, Params.gamma))

# The second class: 2-fold, one to a cell.
centre_1_0 = pyro_complex(wallpaper_helpers.oblique_centre("p2", 2, 1, 0, Params.a, Params.b, Params.gamma))

# The third class: 2-fold, one to a cell.
centre_2_0 = pyro_complex(wallpaper_helpers.oblique_centre("p2", 2, 2, 0, Params.a, Params.b, Params.gamma))

# The fourth class: 2-fold, one to a cell.
centre_3_0 = pyro_complex(wallpaper_helpers.oblique_centre("p2", 2, 3, 0, Params.a, Params.b, Params.gamma))

active_output_ids = Buffer(Global.ActiveOutputIDs)
