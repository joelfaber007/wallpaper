author = Joel Faber
description = Carry the point out of one tile of a Cairo pentagonal tiling to the turn and cell the Cairo enter took it from, undoing the enter.
 The enter keeps which of the four turns of the pentagon in a cell, and which cell, it took each point from. The exit turns the point about the origin by that turn and moves it to that cell, so a point that has not moved since the enter lands exactly where it was.
 Every turn is about the origin and carries the seed onto its image, so the exit needs no `seed`: the one the enter used is carried along by the turn.
 `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
 Give it the `a` of the enter, or the point will be carried back to a tile of a different lattice.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p4g_cairo_exit
info = f"square lattice, tiles {Params.tile_id}"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
tile_id = pyro_param_integer(0, min=0)

[wallpaper_p4g_cairo_exit]
zin = Buffer(Global.PyroXY)

# Which turn of the pentagon, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

a = pyro_real(Params.a)
