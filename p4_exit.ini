author = Joel Faber
description = Carry the point out of the fundamental domain of wallpaper group p4 (orbifold 442) to the copy and cell the p4 enter took it from, undoing the enter.
 The enter keeps which copy of the domain, in which cell, it took each point from. The exit applies the isometry of the group that carries the domain onto that copy, then the lattice translation to that cell, so a point that has not moved since the enter lands exactly where it was.
 `tile_id` names the buffer the tile is read from. Give it the one the enter wrote. A tile kept by another group's enter is read as a copy of this group's, which carries the point somewhere in this group's tiling but not back to where it was.
 Give it the lattice parameters of the enter, or the point will be carried back to a tile of a different lattice.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p4_exit
info = f"square lattice, tiles {Params.tile_id}"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
tile_id = pyro_param_integer(0, min=0)

[wallpaper_p4_exit]
zin = Buffer(Global.PyroXY)

# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

# The lattice basis the copy table's (u, v) are written in, which also counts
# the cell the tile names in whole steps.
cell0 = pyro_complex(wallpaper_helpers.basis("p4", Params.a, Params.a, 0))
cell1 = pyro_complex(wallpaper_helpers.basis("p4", Params.a, Params.a, 1))
