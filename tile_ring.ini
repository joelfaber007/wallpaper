author = Joel Faber
description = Decide whether the cell of the tile a wallpaper enter function took the point from lies within `radius` cells of the cell at the origin, so a patch of the tiling about the origin can be treated differently from the rest.
 The cell is the one the enter kept, as whole steps (m, n) of the lattice basis. `metric` sets how the steps are counted: 0 takes the larger of |m| and |n|, which makes a square patch on a square lattice; 1 takes |m| + |n|, which makes a diamond; 2 takes the largest of |m|, |n| and |m + n|, which makes a hexagon on a hexagonal lattice. A radius of 0 is the cell at the origin alone.
 It reads the tile the enter kept, so place it anywhere after the enter. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_tile_ring
info = f"radius {Params.radius}, {['square', 'diamond', 'hexagon'][Params.metric]}, tiles {Params.tile_id}"

[PYRO_PARAMETERS]
radius = pyro_param_integer(1, min=0, max=1000)
metric = pyro_param_integer(0, min=0, max=2)
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
inside = The cell lies within `radius` steps of the cell at the origin.
outside = The cell lies further than `radius` steps from the cell at the origin.

[wallpaper_tile_ring]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

radius = pyro_int(Params.radius)
metric = pyro_int(Params.metric)

active_output_ids = Buffer(Global.ActiveOutputIDs)
