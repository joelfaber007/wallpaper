author = Joel Faber
description = Fold the point into one copy of the fundamental domain of wallpaper group cmm (orbifold 2*22), carrying it back by whichever of the group's isometries carried it out.
 A fundamental domain is the smallest piece of the plane the group repeats. One cell of the lattice holds four copies of it, and the fold sends every point of the plane to the place in the first copy that it is a repeat of. Unlike the cmm transform it is not random: the same point always folds to the same place.
 Placed before the cmm transform, the fold makes a kaleidoscope: whatever lands anywhere in the plane is gathered into one copy, and the transform repeats that copy over the whole tiling.
 The domain is everything nearer a seed point of the cell than any other image of the seed under the group. The group's mirrors are edges of the domain whatever the seed, since a mirror is exactly the set of points as near the seed as its reflection.
 `a` and `b` are the sides of the rectangular cell, which holds a second lattice point at its centre: `a` along the x axis, `b` along the y axis. Give it the lattice parameters of the cmm transform it works with, or the domain will not line up with the tiling.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_cmm_fold
info = f"{lattice_helpers.centred_kind(Params.a, Params.b)} lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.4, min=0.01, max=100.0)

[wallpaper_cmm_fold]
zin = Buffer(Global.PyroXY)

# Where the copies lie: the lattice basis the copy table's (u, v) are
# written in, then a reduced basis of the same lattice and the rows of its
# inverse, which the kernel finds the nearest repeat of each copy with.
cell0 = pyro_complex(wallpaper_helpers.basis("cmm", Params.a, Params.b, 0))
cell1 = pyro_complex(wallpaper_helpers.basis("cmm", Params.a, Params.b, 1))
near0 = pyro_complex(fold_helpers.near_basis("cmm", Params.a, Params.b, 0))
near1 = pyro_complex(fold_helpers.near_basis("cmm", Params.a, Params.b, 1))
inv0 = pyro_complex(fold_helpers.near_fold("cmm", Params.a, Params.b, 0))
inv1 = pyro_complex(fold_helpers.near_fold("cmm", Params.a, Params.b, 1))

# One preset for each lattice type a centred rectangular cell can make: equal
# sides give a square lattice turned 45 degrees to the cell, and sides in the
# ratio sqrt(3) a hexagonal one. They set only the lattice, so the rest of the
# parameters are left as they are.
[PYRO_PRESET.Rhombic]
a = 1.0
b = 1.4

[PYRO_PRESET.Square]
a = 1.0
b = 1.0

[PYRO_PRESET.Hexagonal]
a = 1.0
b = numpy.sqrt(3)
