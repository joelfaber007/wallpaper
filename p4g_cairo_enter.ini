author = Joel Faber
description = Fold the point into one tile of a Cairo pentagonal tiling, exactly as the p4g Cairo fold does, and keep which turn of the tile, in which cell, it was taken from, so that the Cairo exit can carry it back there.
 Functions placed between the enter and the exit act on the point inside the one pentagon, and the exit carries what they do back to the pentagon the point came from, turned with it. So each pentagon has those functions applied in its own frame, and every point ends in the pentagon it started in: unlike the fold and the scatter, the pair spreads nothing over the tiling, and the pattern covers what came in.
 `seed` sets the pentagon's shape, as it does for the p4g Cairo fold.
 `tile_id` names the buffer the tile is kept in. Give the exit the same one, and give a pair nested inside another pair a different one.
 Give the exit the `a` of the enter, or the point will be carried back to a tile of a different lattice.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p4g_cairo_enter
info = f"square lattice, seed {Params.seed:g}, tiles {Params.tile_id}"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
seed = pyro_param_real(0.1830127018922193, min=0.01, max=0.25)
tile_id = pyro_param_integer(0, min=0)

[wallpaper_p4g_cairo_enter]
zin = Buffer(Global.PyroXY)

# Which turn of the pentagon, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

a = pyro_real(Params.a)
seed = pyro_real(Params.seed)

# One preset for each named pentagon of the family. They set only the seed,
# so the lattice is left as it is.
[PYRO_PRESET.Snub square dual]
seed = 0.1830127018922193

[PYRO_PRESET.Equilateral]
seed = 0.1555088817476932
