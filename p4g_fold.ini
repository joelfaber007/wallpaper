author = Joel Faber
description = Fold the point into one copy of the fundamental domain of wallpaper group p4g (orbifold 4*2), carrying it back by whichever of the group's isometries carried it out.
 A fundamental domain is the smallest piece of the plane the group repeats. One cell of the lattice holds eight copies of it, and the fold sends every point of the plane to the place in the first copy that it is a repeat of. Unlike the p4g transform it is not random: the same point always folds to the same place.
 Placed before the p4g transform, the fold makes a kaleidoscope: whatever lands anywhere in the plane is gathered into one copy, and the transform repeats that copy over the whole tiling.
 The domain is everything nearer a seed point of the cell than any other image of the seed under the group. The group's mirrors are edges of the domain whatever the seed, since a mirror is exactly the set of points as near the seed as its reflection.
 `a` is the side of the square cell. Give it the lattice parameters of the p4g transform it works with, or the domain will not line up with the tiling.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p4g_fold
info = "square lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)

[wallpaper_p4g_fold]
zin = Buffer(Global.PyroXY)

# Where the copies lie: the lattice basis the copy table's (u, v) are
# written in, then a reduced basis of the same lattice and the rows of its
# inverse, which the kernel finds the nearest repeat of each copy with.
cell0 = pyro_complex(wallpaper_helpers.basis("p4g", Params.a, Params.a, 0))
cell1 = pyro_complex(wallpaper_helpers.basis("p4g", Params.a, Params.a, 1))
near0 = pyro_complex(fold_helpers.near_basis("p4g", Params.a, Params.a, 0))
near1 = pyro_complex(fold_helpers.near_basis("p4g", Params.a, Params.a, 1))
inv0 = pyro_complex(fold_helpers.near_fold("p4g", Params.a, Params.a, 0))
inv1 = pyro_complex(fold_helpers.near_fold("p4g", Params.a, Params.a, 1))
