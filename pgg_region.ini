author = Joel Faber
description = Decide which of wallpaper group pgg's special positions (orbifold 22x) holds the input point, so a tile can be treated one way where the group pins it down and another where it does not.
 pgg has two classes of rotation centre (two 2-fold) and two directions of glide axis. A class of rotation centre is a set the group carries one into another - a motif placed on one appears on all of them - so telling the classes apart is telling apart the features that can be decorated independently. Each gets an output of its own.
 `radius` is how near a rotation centre counts as being on it, and `width` how near a line counts. Both are in the same units as the lattice.
 A rotation centre is tested before the lines through it: most centres lie on a mirror, and of the two the centre is the more particular place.
 The positions come from the same move table the pgg transform steps by, so give this the lattice parameters that transform has or the positions will not be where the tiling put them.
type = FUNCTION
class = DECISION
kernel = wallpaper_pgg_region
info = f"{lattice_helpers.rectangular_kind(Params.a, Params.b)} lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.4, min=0.01, max=100.0)
radius = pyro_param_real(0.149, min=0.0, max=100.0)
width = pyro_param_real(0.036, min=0.0, max=100.0)

[PYRO_OUTPUTS]
centre_0 = The point is within the radius of a 2-fold rotation centre of the first class, of which every cell holds two.
centre_1 = The point is within the radius of a 2-fold rotation centre of the second class, of which every cell holds two.
glide = The point is within the width of a glide axis, which the group turns the plane over about and then slides along, holding no point at all still.
general = The point is on none of the group's special positions, and is held by nothing but the translations.

[wallpaper_pgg_region]
zin = Buffer(Global.PyroXY)

# Folding the point into one cell is the first thing any question about
# where it lies has to do, and takes the basis both ways round.
fold0 = pyro_complex(wallpaper_helpers.fold("pgg", Params.a, Params.b, 0))
fold1 = pyro_complex(wallpaper_helpers.fold("pgg", Params.a, Params.b, 1))
cell0 = pyro_complex(wallpaper_helpers.basis("pgg", Params.a, Params.b, 0))
cell1 = pyro_complex(wallpaper_helpers.basis("pgg", Params.a, Params.b, 1))

# Squared here so the kernel compares squared distances and no point pays
# for a square root.
r_squared = pyro_real(Params.radius * Params.radius)

# The first class: 2-fold, two to a cell.
centre_0_0 = pyro_complex(wallpaper_helpers.centre("pgg", 2, 0, 0, Params.a, Params.b))
centre_0_1 = pyro_complex(wallpaper_helpers.centre("pgg", 2, 0, 1, Params.a, Params.b))

# The second class: 2-fold, two to a cell.
centre_1_0 = pyro_complex(wallpaper_helpers.centre("pgg", 2, 1, 0, Params.a, Params.b))
centre_1_1 = pyro_complex(wallpaper_helpers.centre("pgg", 2, 1, 1, Params.a, Params.b))

width = pyro_real(Params.width)

# The first direction of glide axis: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
glide_0 = pyro_complex(wallpaper_helpers.glide_direction("pgg", 0, Params.a, Params.b))
glide_0_at = pyro_real(wallpaper_helpers.glide_offset("pgg", 0, Params.a, Params.b))
glide_0_gap = pyro_real(wallpaper_helpers.glide_spacing("pgg", 0, Params.a, Params.b))

# The second direction of glide axis: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
glide_1 = pyro_complex(wallpaper_helpers.glide_direction("pgg", 1, Params.a, Params.b))
glide_1_at = pyro_real(wallpaper_helpers.glide_offset("pgg", 1, Params.a, Params.b))
glide_1_gap = pyro_real(wallpaper_helpers.glide_spacing("pgg", 1, Params.a, Params.b))

active_output_ids = Buffer(Global.ActiveOutputIDs)

# One preset for each lattice type a rectangular cell can make. They set only
# the lattice, so the rest of the parameters are left as they are.
[PYRO_PRESET.Rectangular]
a = 1.0
b = 1.4

[PYRO_PRESET.Square]
a = 1.0
b = 1.0
