author = Joel Faber
description = Decide whether the tile a wallpaper enter function took the point from is a copy of the fundamental domain only turned, or one flipped over, so the left- and right-handed tiles of a pattern can be treated differently.
 It reads the tile the enter kept, so place it anywhere after the enter: between the enter and the exit, or after the exit once the point is back in its tile. It works for every group's enter. A group with no mirrors or glides, such as p4 or p6, has no flipped copies, and the Cairo enter never flips, so with those every point is turned.
 `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_tile_side
info = f"tiles {Params.tile_id}"

[PYRO_PARAMETERS]
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
turned = The tile is the fundamental domain turned, or the domain itself, with the same side up as the domain.
flipped = The tile is the fundamental domain flipped over, by a mirror or a glide, so it is the domain's mirror image.

[wallpaper_tile_side]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

active_output_ids = Buffer(Global.ActiveOutputIDs)
