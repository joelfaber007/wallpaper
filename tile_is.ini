author = Joel Faber
description = Decide whether the tile a wallpaper enter function took the point from lies in one particular cell, so the copies of the domain in a single cell can be picked out together.
 A cell is named as whole steps (m, n) of the lattice basis; every copy of the fundamental domain in it matches. Cell (0, 0) holds the domain itself. To pick out one copy within the cell, use `tile_copy_is`.
 It reads the tile the enter kept, so place it anywhere after the enter. `tile_id` names the buffer the tile is read from. Give it the one the enter wrote.
type = FUNCTION
class = DECISION
kernel = wallpaper_tile_is
info = f"cell ({Params.m}, {Params.n}), tiles {Params.tile_id}"

[PYRO_PARAMETERS]
m = pyro_param_integer(0, min=-1000, max=1000)
n = pyro_param_integer(0, min=-1000, max=1000)
tile_id = pyro_param_integer(0, min=0)

[PYRO_OUTPUTS]
match = The tile is any copy in cell (`m`, `n`).
other = The tile is in any other cell.

[wallpaper_tile_is]
# Which copy of the domain, in which cell, each point was taken from.
tile = Buffer(Package.WallpaperTile, id=Params.tile_id)

m = pyro_int(Params.m)
n = pyro_int(Params.n)

active_output_ids = Buffer(Global.ActiveOutputIDs)
