author = Joel Faber
description = Fold the point into one tile of a Cairo pentagonal tiling, whose symmetry is wallpaper group p4g (orbifold 4*2), carrying it back by whichever of the group's quarter turns and translations carried it out.
 The tile is everything nearer a seed point than any other image of the seed under the group. The seed lies on one of the group's mirrors, so the tile is two copies of the fundamental domain joined across that mirror, and it is a pentagon with right angles at two of the 4-fold centres. One cell of the lattice holds four tiles.
 `seed` places the seed along the mirror, as a fraction of `a`: at (seed, 1/2 - seed) a, between the 2-fold centre at 0 and the point (a/4, a/4) at 1/4. It sets the pentagon's shape. Near 0 the pentagon's short edge grows and the angle opposite it opens towards a straight line; at 1/4 the short edge shrinks to nothing and the tile is a square.
 Unlike the p4g fold it lands in a whole tile, not half of one, so a motif folded here is not made mirror-symmetric within its tile. Followed by the p4g scatter, which also applies the group's flips, every tile shows the motif together with its mirror image.
 `a` is the side of the square cell. Give it the lattice parameters of the p4g plugins it works with, or the tiles will not line up with the tiling.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p4g_cairo_fold
info = f"square lattice, seed {Params.seed:g}"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
seed = pyro_param_real(0.1830127018922193, min=0.01, max=0.25)

[wallpaper_p4g_cairo_fold]
zin = Buffer(Global.PyroXY)

a = pyro_real(Params.a)
seed = pyro_real(Params.seed)

# One preset for each named pentagon of the family. They set only the seed,
# so the lattice is left as it is.
[PYRO_PRESET.Snub square dual]
seed = 0.1830127018922193

[PYRO_PRESET.Equilateral]
seed = 0.1555088817476932
