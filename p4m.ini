author = The PyroFractal Team
description = Step the point into an adjacent tile of wallpaper group p4m (orbifold *442), so iterating tiles the plane with that group's symmetry.
 p4m is a square lattice with the full symmetry of the square: quarter turns together with mirrors along the sides of the cell and along both its diagonals.
 `a` is the side of the square cell.
 One call applies one of the four translations, the quarter turn or one of the three mirrors, picked at random, so the point lands in a neighbouring tile.
 `symmetry` is the share of steps that turn the plane over onto itself - the rotations, mirrors and glides - rather than carrying the point to another tile. Raise it to resolve each tile's own symmetry more finely, lower it to spread the pattern across the pane faster.
 The moves are not equally likely: their shares are set so the pattern spreads at the same rate in every direction, which keeps the tessellation even across the render instead of stretching it into a band.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p4m
info = "square lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
symmetry = pyro_param_real(0.5, min=0.01, max=0.99)

[wallpaper_p4m]
zin = Buffer(Global.PyroXY)
random_state = Buffer(Global.PyroRNG)

a = pyro_real(Params.a)

# The moves are drawn with unequal probability so the walk spreads equally in
# every direction whatever shape the cell is. The shares are worked out on the
# host from the move table itself and handed over already accumulated, so the
# kernel picks a move with one uniform draw and no branch.
cw0 = pyro_real(wallpaper_helpers.threshold("p4m", 0, Params.a, Params.a, Params.symmetry))
cw1 = pyro_real(wallpaper_helpers.threshold("p4m", 1, Params.a, Params.a, Params.symmetry))
cw2 = pyro_real(wallpaper_helpers.threshold("p4m", 2, Params.a, Params.a, Params.symmetry))
cw3 = pyro_real(wallpaper_helpers.threshold("p4m", 3, Params.a, Params.a, Params.symmetry))
cw4 = pyro_real(wallpaper_helpers.threshold("p4m", 4, Params.a, Params.a, Params.symmetry))
cw5 = pyro_real(wallpaper_helpers.threshold("p4m", 5, Params.a, Params.a, Params.symmetry))
cw6 = pyro_real(wallpaper_helpers.threshold("p4m", 6, Params.a, Params.a, Params.symmetry))
