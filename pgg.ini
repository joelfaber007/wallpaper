author = The PyroFractal Team
description = Step the point into an adjacent tile of wallpaper group pgg (orbifold 22x), so iterating tiles the plane with that group's symmetry.
 pgg is a rectangular lattice together with two glide reflections at right angles to each other, and the half turns their product gives. It has no plain mirror.
 `a` and `b` are the sides of the rectangular cell: `a` along the x axis, `b` along the y axis. One glide runs along y = 0 and slides half the cell width, the other along x = 0 and slides half the cell height.
 One call applies one of the four translations, one of the two glides or the half turn, picked at random, so the point lands in a neighbouring tile.
 `symmetry` is the share of steps that turn the plane over onto itself - the rotations, mirrors and glides - rather than carrying the point to another tile. Raise it to resolve each tile's own symmetry more finely, lower it to spread the pattern across the pane faster.
 The moves are not equally likely: their shares are set so the pattern spreads at the same rate in every direction, which keeps the tessellation even across the render instead of stretching it into a band.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_pgg
info = f"{lattice_helpers.rectangular_kind(Params.a, Params.b)} lattice"

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.4, min=0.01, max=100.0)
symmetry = pyro_param_real(0.5, min=0.01, max=0.99)

[wallpaper_pgg]
zin = Buffer(Global.PyroXY)
random_state = Buffer(Global.PyroRNG)

a = pyro_real(Params.a)
b = pyro_real(Params.b)

# The moves are drawn with unequal probability so the walk spreads equally in
# every direction whatever shape the cell is. The shares are worked out on the
# host from the move table itself and handed over already accumulated, so the
# kernel picks a move with one uniform draw and no branch.
cw0 = pyro_real(wallpaper_helpers.threshold("pgg", 0, Params.a, Params.b, Params.symmetry))
cw1 = pyro_real(wallpaper_helpers.threshold("pgg", 1, Params.a, Params.b, Params.symmetry))
cw2 = pyro_real(wallpaper_helpers.threshold("pgg", 2, Params.a, Params.b, Params.symmetry))
cw3 = pyro_real(wallpaper_helpers.threshold("pgg", 3, Params.a, Params.b, Params.symmetry))
cw4 = pyro_real(wallpaper_helpers.threshold("pgg", 4, Params.a, Params.b, Params.symmetry))
cw5 = pyro_real(wallpaper_helpers.threshold("pgg", 5, Params.a, Params.b, Params.symmetry))

# One preset for each lattice type a rectangular cell can make. They set only
# the lattice, so the rest of the parameters are left as they are.
[PYRO_PRESET.Rectangular]
a = 1.0
b = 1.4

[PYRO_PRESET.Square]
a = 1.0
b = 1.0
