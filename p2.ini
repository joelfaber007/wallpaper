author = The PyroFractal Team
description = Step the point into an adjacent tile of wallpaper group p2 (orbifold 2222), so iterating tiles the plane with that group's symmetry.
 p2 is an oblique lattice together with a half turn, so the tiling repeats by translation and by rotation through 180 degrees.
 `a` is the length of the first lattice vector, which lies along the x axis, and `b` and `gamma` are the length of the second and the angle it makes with the first.
 The lattice, not the basis, is what gets tiled: the pair you type is reduced to the shortest pair generating the same lattice, and the walk steps along that pair and the shorter diagonal of the cell they span.
 One call applies one of the six translations or one of the two half turns, picked at random, so the point lands in a neighbouring tile.
 `symmetry` is the share of steps that turn the plane over onto itself - the rotations, mirrors and glides - rather than carrying the point to another tile. Raise it to resolve each tile's own symmetry more finely, lower it to spread the pattern across the pane faster.
 The moves are not equally likely: their shares are set so the pattern spreads at the same rate in every direction on any lattice, which keeps the tessellation from stretching into a band. A rectangular lattice never steps along the diagonal.
type = FUNCTION
class = XYTRANSFORM
kernel = wallpaper_p2

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
b = pyro_param_real(1.0, min=0.01, max=100.0)
gamma = pyro_param_real(2 * numpy.pi / 5, min=0.01, max=numpy.pi - 0.01)
symmetry = pyro_param_real(0.5, min=0.01, max=0.99)

[wallpaper_p2]
zin = Buffer(Global.PyroXY)
random_state = Buffer(Global.PyroRNG)

# The walk steps by the basis vectors and their sum, so a long thin basis
# spreads the render into a band. Reduction picks the shortest pair that
# generates the same lattice, at 90 degrees or more to each other so their
# sum is the shorter diagonal, which leaves the tiling alone and evens the
# spread out.
a1 = pyro_complex(lattice_helpers.reduced(Params.a, Params.b, Params.gamma, 0))
a2 = pyro_complex(lattice_helpers.reduced(Params.a, Params.b, Params.gamma, 1))

# The moves are drawn with unequal probability so the walk spreads at the
# same rate in every direction. The shares are worked out on the host from
# the move table itself and handed over already accumulated, so the kernel
# picks a move with one uniform draw and no branch.
cw0 = pyro_real(wallpaper_helpers.oblique_threshold("p2", 0, Params.a, Params.b, Params.gamma, Params.symmetry))
cw1 = pyro_real(wallpaper_helpers.oblique_threshold("p2", 1, Params.a, Params.b, Params.gamma, Params.symmetry))
cw2 = pyro_real(wallpaper_helpers.oblique_threshold("p2", 2, Params.a, Params.b, Params.gamma, Params.symmetry))
cw3 = pyro_real(wallpaper_helpers.oblique_threshold("p2", 3, Params.a, Params.b, Params.gamma, Params.symmetry))
cw4 = pyro_real(wallpaper_helpers.oblique_threshold("p2", 4, Params.a, Params.b, Params.gamma, Params.symmetry))
cw5 = pyro_real(wallpaper_helpers.oblique_threshold("p2", 5, Params.a, Params.b, Params.gamma, Params.symmetry))
cw6 = pyro_real(wallpaper_helpers.oblique_threshold("p2", 6, Params.a, Params.b, Params.gamma, Params.symmetry))
