author = The PyroFractal Team
description = Decide which of wallpaper group p4m's special positions (orbifold *442) holds the input point, so a tile can be treated one way where the group pins it down and another where it does not.
 p4m has three classes of rotation centre (two 4-fold, one 2-fold), four directions of mirror line and two of glide axis. A class of rotation centre is a set the group carries one into another - a motif placed on one appears on all of them - so telling the classes apart is telling apart the features that can be decorated independently. Each gets an output of its own.
 `radius` is how near a rotation centre counts as being on it, and `width` how near a line counts. Both are in the same units as the lattice.
 A rotation centre is tested before the lines through it: most centres lie on a mirror, and of the two the centre is the more particular place.
 The positions come from the same move table the p4m transform steps by, so give this the lattice parameters that transform has or the positions will not be where the tiling put them.
type = FUNCTION
class = DECISION
kernel = wallpaper_p4m_region

[PYRO_PARAMETERS]
a = pyro_param_real(1.0, min=0.01, max=100.0)
radius = pyro_param_real(0.126, min=0.0, max=100.0)
width = pyro_param_real(0.013, min=0.0, max=100.0)

[PYRO_OUTPUTS]
centre_0 = The point is within the radius of a 4-fold rotation centre of the first class, of which every cell holds one.
centre_1 = The point is within the radius of a 4-fold rotation centre of the second class, of which every cell holds one.
centre_2 = The point is within the radius of a 2-fold rotation centre of the third class, of which every cell holds two.
mirror = The point is within the width of a mirror line, which the group turns the plane over about while holding every point of the line still.
glide = The point is within the width of a glide axis, which the group turns the plane over about and then slides along, holding no point at all still.
general = The point is on none of the group's special positions, and is held by nothing but the translations.

[wallpaper_p4m_region]
zin = Buffer(Global.PyroXY)

# Folding the point into one cell is the first thing any question about
# where it lies has to do, and takes the basis both ways round.
fold0 = pyro_complex(wallpaper_helpers.fold("p4m", Params.a, Params.a, 0))
fold1 = pyro_complex(wallpaper_helpers.fold("p4m", Params.a, Params.a, 1))
cell0 = pyro_complex(wallpaper_helpers.basis("p4m", Params.a, Params.a, 0))
cell1 = pyro_complex(wallpaper_helpers.basis("p4m", Params.a, Params.a, 1))

# Squared here so the kernel compares squared distances and no point pays
# for a square root.
r_squared = pyro_real(Params.radius * Params.radius)

# The first class: 4-fold, one to a cell.
centre_0_0 = pyro_complex(wallpaper_helpers.centre("p4m", 4, 0, 0, Params.a, Params.a))

# The second class: 4-fold, one to a cell.
centre_1_0 = pyro_complex(wallpaper_helpers.centre("p4m", 4, 1, 0, Params.a, Params.a))

# The third class: 2-fold, two to a cell.
centre_2_0 = pyro_complex(wallpaper_helpers.centre("p4m", 2, 0, 0, Params.a, Params.a))
centre_2_1 = pyro_complex(wallpaper_helpers.centre("p4m", 2, 0, 1, Params.a, Params.a))

width = pyro_real(Params.width)

# The first direction of mirror line: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
mirror_0 = pyro_complex(wallpaper_helpers.mirror_direction("p4m", 0, Params.a, Params.a))
mirror_0_at = pyro_real(wallpaper_helpers.mirror_offset("p4m", 0, Params.a, Params.a))
mirror_0_gap = pyro_real(wallpaper_helpers.mirror_spacing("p4m", 0, Params.a, Params.a))

# The second direction of mirror line: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
mirror_1 = pyro_complex(wallpaper_helpers.mirror_direction("p4m", 1, Params.a, Params.a))
mirror_1_at = pyro_real(wallpaper_helpers.mirror_offset("p4m", 1, Params.a, Params.a))
mirror_1_gap = pyro_real(wallpaper_helpers.mirror_spacing("p4m", 1, Params.a, Params.a))

# The third direction of mirror line: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
mirror_2 = pyro_complex(wallpaper_helpers.mirror_direction("p4m", 2, Params.a, Params.a))
mirror_2_at = pyro_real(wallpaper_helpers.mirror_offset("p4m", 2, Params.a, Params.a))
mirror_2_gap = pyro_real(wallpaper_helpers.mirror_spacing("p4m", 2, Params.a, Params.a))

# The fourth direction of mirror line: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
mirror_3 = pyro_complex(wallpaper_helpers.mirror_direction("p4m", 3, Params.a, Params.a))
mirror_3_at = pyro_real(wallpaper_helpers.mirror_offset("p4m", 3, Params.a, Params.a))
mirror_3_gap = pyro_real(wallpaper_helpers.mirror_spacing("p4m", 3, Params.a, Params.a))

# The first direction of glide axis: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
glide_0 = pyro_complex(wallpaper_helpers.glide_direction("p4m", 0, Params.a, Params.a))
glide_0_at = pyro_real(wallpaper_helpers.glide_offset("p4m", 0, Params.a, Params.a))
glide_0_gap = pyro_real(wallpaper_helpers.glide_spacing("p4m", 0, Params.a, Params.a))

# The second direction of glide axis: a unit vector along it, then how far
# the first lies from the origin measured across that, and how far apart
# consecutive ones lie.
glide_1 = pyro_complex(wallpaper_helpers.glide_direction("p4m", 1, Params.a, Params.a))
glide_1_at = pyro_real(wallpaper_helpers.glide_offset("p4m", 1, Params.a, Params.a))
glide_1_gap = pyro_real(wallpaper_helpers.glide_spacing("p4m", 1, Params.a, Params.a))

active_output_ids = Buffer(Global.ActiveOutputIDs)
